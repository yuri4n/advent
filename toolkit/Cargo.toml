[package]
name = "advent-toolkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "aoc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
scraper = "0.22"

[dev-dependencies]
tempfile = "3"
